# Fine-tune Geneformer V2 to classify senescent vs proliferating cells.
tokenized_dataset: data/senescence/tokenized/senescence.dataset
output_dir: outputs/senescence/finetune
output_prefix: senescence

state_key: senescence_label
states: ["senescent", "proliferating"]
filter_data: null
stratify_splits_col: dataset_id   # split by study — batch failure mode canary

model_directory: checkpoints/geneformer-V2-104M   # produced by scripts/00_fetch_geneformer.py
model_version: V2
freeze_layers: 2
quantize_4bit_lora: false          # avoid quantization kernel incompatibilities

num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
learning_rate: 5.0e-5
weight_decay: 0.001
warmup_ratio: 0.03
logging_steps: 25
eval_strategy: epoch
save_strategy: epoch
load_best_model_at_end: true
metric_for_best_model: eval_macro_f1
greater_is_better: true
seed: 0

num_crossval_splits: 1
split_sizes: { train: 0.8, valid: 0.1, test: 0.1 }
forward_batch_size: 16

nproc: 8
ngpu: 1
