tokenized_dataset: data/fibroblast/GSE226225/tokenized/fibroblast_gse226225.dataset
output_dir: outputs/fibroblast/GSE226225/finetune
output_prefix: fibroblast_gse226225

state_key: senescence_label
states: ["senescent", "proliferating"]
filter_data: null
stratify_splits_col: null

model_directory: checkpoints/geneformer-V2-104M
model_version: V2
freeze_layers: 2
quantize_4bit_lora: false

num_train_epochs: 3
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
learning_rate: 5.0e-5
weight_decay: 0.001
warmup_ratio: 0.03
logging_steps: 100
eval_strategy: "no"
save_strategy: epoch
load_best_model_at_end: false
metric_for_best_model: eval_macro_f1
greater_is_better: true
seed: 42

num_crossval_splits: 1
split_sizes: {train: 0.8, valid: 0.1, test: 0.1}
forward_batch_size: 16
nproc: 8
ngpu: 1
